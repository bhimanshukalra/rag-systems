name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the fully mocked suite runs here: no API keys, no live Pinecone/Groq/
# Tavily calls, no eval smoke check (decided in agentic_rag/planning/phases/phase-3.md).
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic_rag
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agentic_rag/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        run: uv run pytest -q
