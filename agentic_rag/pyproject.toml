[project]
name = "agentic-rag"
version = "0.1.0"
description = "Production-ready agentic RAG service: multi-source ingestion, hybrid retrieval, and a ReAct tool-calling agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.115.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=0.3.0",
    "pinecone>=7.3.0",
    "pydantic-settings>=2.5.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
